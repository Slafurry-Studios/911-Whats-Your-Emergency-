name: Build and Deploy to itch.io

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type baked into the version tag: release/beta/alpha → v1.2.3-release / v1.2.3-beta / v1.2.3-alpha."
        required: false
        type: choice
        default: "release"
        options:
          - "release"
          - "beta"
          - "alpha"
      release_tag:
        description: "Version number, e.g. 1.2.3. Becomes v1.2.3-{release_type} automatically. Leave empty for an unversioned build."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  UNITY_PROJECT_PATH: ${{ vars.UNITY_PROJECT_PATH || '.' }}
  ITCH_USER: ${{ vars.ITCH_USER }}
  ITCH_GAME: ${{ vars.ITCH_GAME }}
  GAME_DISPLAY_NAME: ${{ vars.GAME_DISPLAY_NAME || vars.ITCH_GAME }}
  ITCH_CHANNEL_WEBGL: ${{ vars.ITCH_CHANNEL_WEBGL || 'html5' }}

  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
  GEMINI_PERSONA: ${{ vars.GEMINI_PERSONA || 'You are a laid-back, enthusiastic game release announcer with a light sense of humor.' }}
  GEMINI_LANGUAGE: ${{ vars.GEMINI_LANGUAGE || '' }}

jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build WebGL
    # Pin to ubuntu-22.04: ubuntu-latest (26.04) breaks buildalon/unity-setup@v2
    # because Unity Hub can't install at /opt/unityhub/unityhub.
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: >-
            Library-ubuntu-latest-WebGL-
            ${{ hashFiles(
              format('{0}/Assets/**', env.UNITY_PROJECT_PATH),
              format('{0}/Packages/**', env.UNITY_PROJECT_PATH),
              format('{0}/ProjectSettings/**', env.UNITY_PROJECT_PATH)
            ) }}
          restore-keys: |
            Library-ubuntu-latest-WebGL-
            Library-ubuntu-latest-

      - name: Setup Unity
        uses: buildalon/unity-setup@v2
        with:
          version-file: ${{ env.UNITY_PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: WebGL
          cache-installation: true
          auto-update-hub: false

      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Unity project
        uses: buildalon/unity-action@v3
        with:
          args: >-
            -quit
            -batchmode
            -nographics
            -projectPath "${{ env.UNITY_PROJECT_PATH }}"
            -buildTarget WebGL
            -executeMethod BuildScript.Build
            -logFile "${{ github.workspace }}/unity-build.log"

      - name: Diagnose Unity failure
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "UNITY BUILD FAILED"
          echo "========================================"
          if [ -f "${GITHUB_WORKSPACE}/unity-build.log" ]; then
            grep -n -E "error CS|error:|Error|Exception|Build failed|BuildScript|unsupported|not installed|scripting backend" "${GITHUB_WORKSPACE}/unity-build.log" | tail -200 || true
            tail -300 "${GITHUB_WORKSPACE}/unity-build.log"
          else
            echo "Unity build log was not generated."
          fi

      - name: Verify build output
        shell: bash
        run: |
          set -e
          if [ ! -d "build/WebGL" ]; then
            echo "::error::Build output not found: build/WebGL"
            if [ -d build ]; then
              find build -maxdepth 6 -print
            fi
            exit 1
          fi
          find build/WebGL -maxdepth 6 -type f | head -200
          echo "Build verification successful."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # DEPLOY TO ITCH.IO
  # ============================================================

  deploy:
    name: Deploy to itch.io

    needs:
      - build
    # Pin to ubuntu-22.04: ubuntu-latest (26.04) breaks buildalon/unity-setup@v2.
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.value }}
      previous: ${{ steps.version.outputs.previous }}

    steps:

      - name: Resolve version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ inputs.release_tag }}"
          RELEASE_TYPE="${{ inputs.release_type }}"

          if [ -n "${RAW_TAG}" ]; then
            case "${RAW_TAG}" in
              v*) VERSION="${RAW_TAG}"   ;;
              *)  VERSION="v${RAW_TAG}"  ;;
            esac
            VERSION="${VERSION}-${RELEASE_TYPE}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

          PREVIOUS=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "DEPLOYMENT VERSION: ${VERSION}"
          echo "Last run: ${PREVIOUS:-none}"

      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: builds/webgl

      - name: Install Butler
        shell: bash
        run: |
          set -e
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler
          chmod +x butler/butler
          echo "${GITHUB_WORKSPACE}/butler" >> "$GITHUB_PATH"

      - name: Verify Butler
        shell: bash
        run: butler -V

      - name: Push WebGL to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          set -e
          butler push builds/webgl "${ITCH_USER}/${ITCH_GAME}:${ITCH_CHANNEL_WEBGL}" --userversion "${{ steps.version.outputs.value }}"


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  github-release:
    name: Publish GitHub Release

    needs:
      - build
      - deploy

    if: inputs.release_tag != ''
    # Pin to ubuntu-22.04: ubuntu-latest (26.04) breaks buildalon/unity-setup@v2.
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -e
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            if [ "$(git rev-parse "${PREV_TAG}^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
              PREV_TAG=$(git describe --tags --abbrev=0 "${PREV_TAG}^" 2>/dev/null || true)
            fi
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          elif [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi

          CHANGELOG=$(git log "$RANGE" --pretty=format:'- %h %s' | head -20)
          [ -z "$CHANGELOG" ] && CHANGELOG="- No commit messages available for this range."

          {
            echo "text<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes with Gemini
        id: notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERSION: ${{ needs.deploy.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        shell: bash
        run: |
          set -e
          PROMPT="${GEMINI_PERSONA}

          Changelog for release ${VERSION}:
          ${CHANGELOG}

          Write concise GitHub release notes for version ${VERSION}. Use markdown, start with a '## What's Changed' heading, and turn commits into a short bulleted list."

          BODY=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')
          RESPONSE=$(curl -sS -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" -H "Content-Type: application/json" -d "$BODY")
          TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          [ -z "$TEXT" ] && TEXT="$CHANGELOG"

          {
            echo "text<<GEMINI_EOF"
            echo "$TEXT"
            echo "GEMINI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: builds/WebGL

      - name: Zip WebGL build
        shell: bash
        run: |
          set -e
          cd builds
          VERSION="${{ needs.deploy.outputs.version }}"
          [ -d WebGL ] && zip -r "../${VERSION}-WebGL.zip" WebGL

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.deploy.outputs.version }}
          name: ${{ needs.deploy.outputs.version }}
          body: ${{ steps.notes.outputs.text }}
          files: "*.zip"
          draft: false
          prerelease: false


  # ============================================================
  # DISCORD NOTIFICATION
  # ============================================================

  notify:
    name: Notify Discord

    needs:
      - deploy

    if: needs.deploy.result == 'success'
    # Pin to ubuntu-22.04: ubuntu-latest (26.04) breaks buildalon/unity-setup@v2.
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -e
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            if [ "$(git rev-parse "${PREV_TAG}^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
              PREV_TAG=$(git describe --tags --abbrev=0 "${PREV_TAG}^" 2>/dev/null || true)
            fi
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          elif [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi

          CHANGELOG=$(git log "$RANGE" --pretty=format:'- %h %s' | head -20)
          [ -z "$CHANGELOG" ] && CHANGELOG="- No commits."

          {
            echo "text<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate flavor text with Gemini
        id: flavor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERSION: ${{ needs.deploy.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        shell: bash
        run: |
          set -e
          RELEASE_LABEL="${RELEASE_TYPE:-release}"
          [ -n "${GEMINI_LANGUAGE}" ] && LANG_INS="Write response in ${GEMINI_LANGUAGE}." || LANG_INS="Write response in persona language."

          PROMPT="${GEMINI_PERSONA}

          Changelog:
          ${CHANGELOG}

          Write ONE short paragraph announcing that a new ${RELEASE_LABEL} WebGL build of \"${GAME_DISPLAY_NAME}\" version ${VERSION} has been deployed to itch.io. ${LANG_INS}"

          BODY=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')
          RESPONSE=$(curl -sS -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" -H "Content-Type: application/json" -d "$BODY")
          TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          [ -z "$TEXT" ] && TEXT="Build baru ${GAME_DISPLAY_NAME} versi ${VERSION} (WebGL) sudah tayang di itch.io!"

          {
            echo "text<<GEMINI_EOF"
            echo "$TEXT"
            echo "GEMINI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_DEPLOY }}
          VERSION: ${{ needs.deploy.outputs.version }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          FLAVOR_TEXT: ${{ steps.flavor.outputs.text }}
        shell: bash
        run: |
          set -e
          ITCH_URL="https://${ITCH_USER}.itch.io/${ITCH_GAME}"
          PAYLOAD=$(jq -n \
            --arg content "$FLAVOR_TEXT" \
            --arg title "${GAME_DISPLAY_NAME} — Build ${VERSION} (WebGL) deployed" \
            --arg url "$ITCH_URL" \
            --arg rel "${RELEASE_TYPE:-release}" \
            --arg prev "${PREVIOUS:-none}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $content,
                color: 5814783,
                fields: [
                  {name: "Platform", value: "WebGL", inline: true},
                  {name: "Release type", value: $rel, inline: true},
                  {name: "Last version", value: $prev, inline: true}
                ]
              }]
            }')

          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"


  # ============================================================
  # DISCORD FAILURE NOTIFICATION
  # ============================================================

  notify-failure:
    name: Notify Discord (Failure)

    needs:
      - build
      - deploy

    if: failure()
    # Pin to ubuntu-22.04: ubuntu-latest (26.04) breaks buildalon/unity-setup@v2.
    runs-on: ubuntu-22.04

    steps:

      - name: Generate failure message with Gemini
        id: flavor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_PERSONA: ${{ vars.GEMINI_PERSONA || 'You are a helpful assistant.' }}
          GAME_DISPLAY_NAME: ${{ vars.GAME_DISPLAY_NAME || vars.ITCH_GAME }}
        shell: bash
        run: |
          set -e
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PROMPT="${GEMINI_PERSONA}
          Write ONE short paragraph announcing that the WebGL build and deploy workflow for \"${GAME_DISPLAY_NAME}\" on itch.io has FAILED. Run URL: ${RUN_URL}"

          BODY=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')
          RESPONSE=$(curl -sS -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" -H "Content-Type: application/json" -d "$BODY")
          TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          [ -z "$TEXT" ] && TEXT="Build WebGL ${GAME_DISPLAY_NAME} gagal. Cek log: ${RUN_URL}"

          {
            echo "text<<GEMINI_EOF"
            echo "$TEXT"
            echo "GEMINI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_DEPLOY }}
          FLAVOR_TEXT: ${{ steps.flavor.outputs.text }}
          GAME_DISPLAY_NAME: ${{ vars.GAME_DISPLAY_NAME || vars.ITCH_GAME }}
        shell: bash
        run: |
          set -e
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg content "$FLAVOR_TEXT" \
            --arg title "Build Failed — ${GAME_DISPLAY_NAME} (WebGL)" \
            --arg url "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $content,
                color: 15548997,
                fields: [
                  {name: "Platform", value: "WebGL", inline: true},
                  {name: "Status", value: "❌", inline: true}
                ]
              }]
            }')

          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
